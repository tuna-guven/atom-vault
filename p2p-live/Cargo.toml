[package]
name = "p2p-live"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
aws-lc-rs = { version = "1.17", features = ["unstable"] }
blake3 = "1.8.5"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11"
getrandom = "0.4.3"
hkdf = "0.13.0"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rcgen = "0.14.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
rustls-pki-types = "1.15.0"
sha2 = "0.11.0"
spake2 = "0.4"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tokio-socks = "0.5"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
