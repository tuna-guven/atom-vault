[package]
name = "atom"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"             # The PHC winner for our KDF
chacha20poly1305 = "0.10"  # Provides XChaCha20-Poly1305 for AEAD
rand = "0.8"               # For cryptographically secure random numbers (CSPRNG)
zeroize = { version = "1.7", features = ["zeroize_derive"] } # To securely wipe the DEK from RAM
# Terminal User Interface
clap = { version = "4.5", features = ["derive", "color", "help", "usage"] }
