[package]
name = "atom"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"             # The PHC winner for our KDF
chacha20poly1305 = "0.11"  # Provides XChaCha20-Poly1305 for AEAD
nix = { version = "0.31", features = ["fs", "user", "term"] }
rand = "0.8"               # For cryptographically secure random numbers (CSPRNG)
zeroize = { version = "1.9", features = ["zeroize_derive"] } # To securely wipe the DEK from RAM
fastcdc = "3.1.0"
libc = "0.2"
clap = {version = "4.6.1", features = ["derive"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
bincode = "1.3.3"
p2p-sync = {path = "../p2p-sync"}
data-encoding = "2.11"
hkdf = "0.13"
sha2 = "0.11"
ed25519-dalek = "2.2.0"
tokio-util = "0.7.18"
dirs = "5.0"
arti-client = { version = "0.43.0", features = ["onion-service-service", "onion-service-client", "tokio"] }
tor-hsservice = "0.43.0"
futures = "0.3.32"
tor-cell = "0.43.0"
sha3 = "0.12"
rpassword = "7.5.4"
memfd = "0.6.5"
secrecy = "0.10.3"
tokio-stream = "0.1.18"
scrypt = "0.12.0"
eff-wordlist = "1.0.3"
sysinfo = "0.39"
eframe = "0.30"
rfd = "0.17"
landlock = "0.4"
secret-service = { version = "3", features = ["rt-tokio-crypto-rust"] }
ctrlc = "3.4"

[dev-dependencies]
libc = "0.2"
