[package]
name = "atom"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"             # The PHC winner for our KDF
chacha20poly1305 = "0.10"  # Provides XChaCha20-Poly1305 for AEAD
nix = { version = "0.29.0", features = ["fs", "user", "term"] }
rand = "0.8"               # For cryptographically secure random numbers (CSPRNG)
zeroize = { version = "1.7", features = ["zeroize_derive"] } # To securely wipe the DEK from RAM
fastcdc = "3.1.0"
libc = "0.2"
clap = {version = "4.6.1", features = ["derive"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
bincode = "1.3.3"
p2p-sync = {path = "../p2p-sync"}
data-encoding = "2.3"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = "2.2.0"
tokio-util = "0.7.18"
rusqlite = "0.36"
dirs = "5.0"
arti-client = { version = "0.42.0", features = ["onion-service-service", "onion-service-client", "tokio"] }
tor-hsservice = "0.42.0"
futures = "0.3.32"
tor-cell = "0.42.0"
sha3 = "0.10"
rpassword = "7.5.4"
landlock = "0.4.5"
memfd = "0.6.5"
secrecy = "0.10.3"
tokio-stream = "0.1.18"
gtk4 = "0.11.3"
