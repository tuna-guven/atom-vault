[package]
name = "p2p-direct"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
bincode = "1.3"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
spake2 = "0.4"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt", "macros", "io-util", "fs", "net", "sync"] }
zeroize = "1.9.0"

[features]
default = ["http-store"]
# Enables the HTTP(S) BlindStore backend (pulls in reqwest). Disable for a
# dependency-light build that only uses the in-memory store (e.g. tests).
http-store = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt", "macros", "rt-multi-thread"] }
